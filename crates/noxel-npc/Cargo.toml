[package]
name = "noxel-npc"
description = "Noxel NPC simulation: crowd LOD, flow-field pathfinding, steering and schedules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
noxel-core.workspace = true
noxel-ecs.workspace = true
noxel-physics.workspace = true
noxel-world.workspace = true

# Test-only: `noxel-npc`'s own tests need a real `TileSet` (grass, water, road,
# building floors) to build a world worth pathfinding in. `TileSet` and
# `TileDef` live in `noxel-asset`, and `TileDef` has no `Default`, so a test
# cannot construct one without naming the crate. This is a *dev*-dependency: the
# library's own dependency graph stays core + ecs + physics + world.
[dev-dependencies]
noxel-asset.workspace = true
