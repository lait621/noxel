[package]
name = "noxel-world"
description = "Noxel world: procedural generation, chunk streaming, roads, buildings and prefabs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The world layer depends on exactly two crates: the maths/RNG foundation and the
# asset formats it reads tile sets and prefabs from. Physics, rendering and NPC
# code consume `noxel-world`, never the other way round.
[dependencies]
noxel-core.workspace = true
noxel-asset.workspace = true
